# Mantém o projeto Supabase (plano gratuito) ativo: o Supabase pausa projetos sem uso por 7 dias.
# Roda a cada 3 dias e, no dia 1 de cada mês, grava a data em .github/ultimo-ping.txt
# para o GitHub não desligar este agendamento por falta de atividade no repositório.
name: Manter Supabase ativo
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o banco
        run: |
          code=$(curl -s -o resp.txt -w '%{http_code}' -X POST \
            'https://bdwwxhwsygycrpjintgj.supabase.co/rest/v1/rpc/manter_ativo' \
            -H 'apikey: sb_publishable_IN2KF-NT2r2uEwrbU9GF5g_XZ2O3I6G' \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code: $(cat resp.txt)"
          test "$code" = "200"
      - uses: actions/checkout@v4
      - name: Registrar atividade mensal
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/ultimo-ping.txt
            git config user.name 'manter-ativo'
            git config user.email 'actions@users.noreply.github.com'
            git add .github/ultimo-ping.txt
            git commit -m 'Registro mensal: Supabase ativo' || true
            git push || true
          fi
